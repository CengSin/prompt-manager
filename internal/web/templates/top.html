{{define "top"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{if .Refresh}}<meta http-equiv="refresh" content="{{.Refresh}}">{{end}}
<link rel="icon" href="data:,">
<title>{{.Title}}</title>
<style>
:root {
  --paper: #f3f0ea;
  --ink: #1c1917;
  --stone: #78716c;
  --line: #e4dfd6;
  --field: #fffcf7;
  --edge: #d8d2c8;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 17px/1.65 "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
  -webkit-font-smoothing: antialiased;
}
header, main {
  width: min(40rem, calc(100% - 3rem));
  margin: 0 auto;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1.25rem;
  padding-top: 4.5rem;
}
main { padding-bottom: 5rem; }
.brand {
  display: flex;
  align-items: baseline;
  gap: 0.65rem;
  min-width: 0;
}
.brand h1 {
  margin: 0;
  font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", serif;
  font-size: 1.85rem;
  font-weight: 600;
  letter-spacing: -0.03em;
  line-height: 1;
}
.brand h1 a {
  color: inherit;
  text-decoration: none;
}
.count {
  color: var(--stone);
  font-size: 0.82rem;
}
nav {
  display: flex;
  align-items: center;
  gap: 1.15rem;
  flex: none;
}
nav a.quiet {
  color: var(--ink);
  text-decoration: none;
  font-size: 0.95rem;
}
nav a.quiet:hover {
  text-decoration: underline;
  text-underline-offset: 0.22em;
}
nav a.go {
  color: #fff;
  background: var(--ink);
  text-decoration: none;
  font-size: 0.95rem;
  line-height: 1;
  padding: 0.62rem 0.9rem;
  border-radius: 6px;
}
nav a.go:hover { background: #292524; }
nav a.go:active { transform: scale(0.98); }
form.search { margin: 2.6rem 0 0; }
form.editor, form.confirm {
  display: grid;
  gap: 0.75rem;
}
form.search label {
  display: block;
  margin: 0 0 0.4rem;
  color: var(--stone);
  font-size: 0.82rem;
}
label {
  display: grid;
  gap: 0.35rem;
  font-size: 0.9rem;
}
input, textarea, button { font: inherit; }
input, textarea {
  width: 100%;
  border: 1px solid var(--edge);
  border-radius: 8px;
  background: #fff;
  padding: 0.7rem 0.85rem;
}
.field {
  display: flex;
  align-items: stretch;
  background: var(--field);
  border: 1px solid var(--edge);
  border-radius: 8px;
}
.field:focus-within { border-color: #b7b0a4; }
.field input {
  flex: 1 1 0;
  width: 0;
  min-width: 0;
  border: 0;
  margin: 0;
  background: transparent;
  padding: 0.85rem 1rem;
  border-radius: 8px 0 0 8px;
}
.field input:focus { outline: none; }
input::placeholder { color: #a8a29e; }
textarea, pre.body {
  font: 15px/1.6 ui-monospace, "SFMono-Regular", "Source Han Mono", monospace;
  white-space: pre-wrap;
  word-break: break-word;
}
textarea { min-height: 18rem; }
button, .actions a {
  border-radius: 6px;
  padding: 0.45rem 0.8rem;
}
button {
  border: 0;
  background: var(--ink);
  color: #fff;
  cursor: pointer;
}
button:hover { background: #292524; }
button:active { transform: scale(0.98); }
button.search {
  flex: none;
  border: 0;
  border-left: 1px solid var(--edge);
  background: transparent;
  color: var(--ink);
  padding: 0 1.15rem;
  border-radius: 0 8px 8px 0;
}
button.search:hover { background: #f7f3ec; }
button.copy {
  border: 1px solid var(--edge);
  background: transparent;
  color: var(--ink);
  font-size: 0.82rem;
  line-height: 1;
  padding: 0.38rem 0.62rem;
}
button.copy:hover { background: var(--field); }
a { color: inherit; }
p a {
  text-decoration: underline;
  text-underline-offset: 0.18em;
}
.actions {
  display: flex;
  gap: 0.8rem;
  align-items: center;
  margin-top: 1.25rem;
}
.actions a { color: var(--ink); text-decoration: none; }
.actions a:hover { text-decoration: underline; text-underline-offset: 0.18em; }
article {
  padding: 1.45rem 0 1.3rem;
  border-top: 1px solid var(--line);
}
article p { margin: 0.35rem 0 0; overflow-wrap: anywhere; }
time {
  display: block;
  margin: 0 0 0.4rem;
  color: var(--stone);
  font-size: 0.78rem;
  font-variant-numeric: tabular-nums;
}
a.excerpt {
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  color: inherit;
  text-decoration: none;
  line-height: 1.7;
  overflow-wrap: anywhere;
}
a.excerpt:hover {
  text-decoration: underline;
  text-underline-offset: 0.16em;
  text-decoration-thickness: 1px;
}
.meta {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  margin-top: 0.8rem;
}
a.work {
  color: var(--stone);
  font-size: 0.82rem;
  text-decoration: none;
  overflow-wrap: anywhere;
}
a.work:hover {
  color: var(--ink);
  text-decoration: underline;
  text-underline-offset: 0.18em;
}
.empty { color: var(--stone); }
mark { background: #f3e3b0; color: inherit; }
h2 {
  margin: 1.6rem 0 0;
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--stone);
}
.error { color: #9f1239; margin: 0; }
@media (max-width: 40rem) {
  header, main { width: min(40rem, calc(100% - 2rem)); }
  header { padding-top: 2.4rem; }
  .brand h1 { font-size: 1.55rem; }
  nav { gap: 0.85rem; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1><a href="/">提示词</a></h1>
    {{if .ShowCount}}<span class="count">{{.Count}} 条</span>{{end}}
  </div>
  <nav>
    <a class="quiet" href="/prompts/new">贴上一条</a>
    <a class="go" href="/prompts/draft">写一条</a>
  </nav>
</header>
<main>
{{end}}
